<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal Plantio</title>
<link rel="icon" href="sistema_preenchimento/favicon.svg" type="image/svg+xml">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f9fafb;
  color: #111827;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
header {
  background: #1d4ed8;
  color: #fff;
  position: sticky; top: 0; z-index: 10;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.header-inner {
  max-width: 960px; margin: 0 auto;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.header-logo-box {
  width: 36px; height: 36px;
  background: #fff; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-logo-box svg { width: 20px; height: 20px; color: #1d4ed8; }
.header-text { flex: 1; }
.header-title { font-size: 18px; font-weight: 700; line-height: 1.2; }
.header-sub { font-size: 12px; color: #bfdbfe; }
.header-link {
  font-size: 12px; font-weight: 600; color: #bfdbfe;
  text-decoration: none; border: 1px solid rgba(255,255,255,.3);
  border-radius: 6px; padding: 5px 10px; transition: all .15s;
  white-space: nowrap;
}
.header-link:hover { background: rgba(255,255,255,.1); color: #fff; }

/* ── Main ── */
main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; }
@media (min-width: 640px) { main { padding: 40px 16px; } }

.card {
  background: #fff;
  border: 1px solid #f3f4f6;
  border-radius: 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  padding: 20px;
  width: 100%; max-width: 640px;
}
@media (min-width: 640px) { .card { padding: 28px; } }

/* ── Search ── */
.search-title {
  text-align: center; font-size: 17px; font-weight: 600;
  color: #1f2937; margin-bottom: 4px;
}
@media (min-width: 640px) { .search-title { font-size: 19px; } }
.search-sub { text-align: center; font-size: 13px; color: #9ca3af; margin-bottom: 18px; }
.search-wrap { position: relative; }
.search-input {
  width: 100%; font-size: 15px;
  border: 1.5px solid #e5e7eb; border-radius: 10px;
  padding: 12px 42px 12px 14px;
  outline: none; color: #1f2937;
  transition: border-color .2s, box-shadow .2s;
}
.search-input:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px rgba(96,165,250,.15);
}
.search-clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: #9ca3af; padding: 4px;
  display: none; align-items: center; justify-content: center;
}
.search-clear.on { display: flex; }
.search-clear:hover { color: #4b5563; }

/* ── Summary ── */
.summary { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 10px; }
.summary strong { color: #6b7280; font-weight: 600; }

/* ── Recent ── */
.recent-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .6px; color: #9ca3af;
  text-align: center; margin: 16px 0 8px;
}
.recent-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
.recent-pill {
  font-size: 12px; font-weight: 500; color: #374151;
  background: #f9fafb; border: 1px solid #e5e7eb;
  border-radius: 999px; padding: 5px 13px;
  cursor: pointer; transition: all .15s;
}
.recent-pill:hover { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }

/* ── Loading / Error ── */
.spinner-wrap {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 44px 0; color: #6b7280; font-size: 14px;
}
.spinner {
  width: 22px; height: 22px;
  border: 3px solid #2563eb; border-top-color: transparent;
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  margin-top: 16px;
  background: #fef2f2; border: 1px solid #fecaca;
  border-radius: 12px; padding: 16px;
  color: #b91c1c; display: flex; gap: 10px; font-size: 13px;
}
.error-box > svg { flex-shrink: 0; margin-top: 1px; }

/* ── Results ── */
.results-header { display: flex; align-items: center; margin: 18px 0 10px; }
.results-count { font-size: 13px; color: #6b7280; }
.results-count strong { color: #1f2937; }

/* ── Farm card ── */
.farm-card {
  border: 1px solid #f3f4f6;
  border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px;
  transition: border-color .15s, box-shadow .15s;
}
.farm-card:last-child { margin-bottom: 0; }
.farm-card:hover { border-color: #93c5fd; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.farm-code { font-size: 11px; color: #9ca3af; font-family: monospace; }
.farm-name { font-size: 14px; font-weight: 600; color: #1f2937; margin-top: 1px; }
.farm-date { font-size: 11px; color: #9ca3af; margin-top: 1px; }
.farm-files { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
.file-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.file-suffix {
  font-size: 10px; font-weight: 700; font-family: monospace;
  background: #f3f4f6; color: #4b5563;
  border-radius: 4px; padding: 2px 6px; flex-shrink: 0;
}
.btn-dl {
  display: inline-flex; align-items: center; gap: 5px;
  border: none; border-radius: 7px; padding: 5px 11px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  text-decoration: none; transition: background .15s;
}
.btn-zip  { background: #2563eb; color: #fff; }
.btn-zip:hover  { background: #1d4ed8; }
.btn-dwg  { background: #f3f4f6; color: #4b5563; }
.btn-dwg:hover  { background: #e5e7eb; }
.btn-pdf  { background: none; color: #4f46e5; font-weight: 600; padding: 5px 8px; border-radius: 7px; font-family: inherit; }
.btn-pdf:hover  { background: #eef2ff; }
.btn-pdf-dl { background: none; color: #6b7280; font-size: 11px; font-weight: 500; padding: 5px 6px; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn-pdf-dl:hover { background: #f1f5f9; color: #374151; }
.file-size { font-size: 10px; font-weight: 400; opacity: .8; }

/* ── Empty ── */
.empty {
  background: #f9fafb; border: 1px solid #f3f4f6;
  border-radius: 14px; padding: 52px 20px;
  text-align: center; color: #9ca3af; margin-top: 4px;
}
.empty-icon { width: 48px; height: 48px; margin: 0 auto 12px; color: #e5e7eb; }
.empty p { font-size: 13px; margin-bottom: 14px; }
.empty-wa {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; color: #1d4ed8; text-decoration: underline;
}
.empty-wa:hover { color: #1e3a8a; }

/* ── PDF Viewer Overlay ── */
.viewer-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 1000;
  align-items: center; justify-content: center;
}
.viewer-overlay.open { display: flex; }
.viewer-box {
  background: #fff; border-radius: 12px;
  width: 90vw; height: 90vh; max-width: 1100px;
  display: flex; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,.25); overflow: hidden;
}
.viewer-head {
  padding: 12px 16px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-shrink: 0;
}
.viewer-fname { font-size: 13px; font-weight: 600; font-family: monospace; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-close {
  background: none; border: none; font-size: 24px; line-height: 1;
  cursor: pointer; color: #9ca3af; padding: 0 4px; flex-shrink: 0;
}
.viewer-close:hover { color: #b91c1c; }
.viewer-body { flex: 1; overflow: hidden; }
.viewer-body iframe { width: 100%; height: 100%; border: none; display: block; }

/* ── Footer ── */
footer {
  text-align: center; padding: 14px;
  font-size: 12px; color: #9ca3af;
  border-top: 1px solid #f3f4f6;
  cursor: default; -webkit-user-select: none; user-select: none;
}
.hidden { display: none; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-logo-box">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064" />
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">Portal Plantio</div>
      <div class="header-sub">Projetos de Plantio</div>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <h2 class="search-title">Buscar projeto de plantio</h2>
    <p class="search-sub">Pesquise pelo nome ou código da fazenda</p>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" inputmode="search"
             placeholder="Buscar por nome ou código..." autocomplete="off" />
      <button class="search-clear" id="searchClear" type="button" aria-label="Limpar busca">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <p class="summary hidden" id="summary"></p>

    <div id="recentWrap" class="hidden">
      <p class="recent-label">Atualizados recentemente</p>
      <div class="recent-pills" id="recentPills"></div>
    </div>

    <div class="spinner-wrap" id="loadingEl">
      <div class="spinner"></div>
      <span>Carregando projetos...</span>
    </div>

    <div class="error-box hidden" id="errorEl">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span id="errorMsg"></span>
    </div>

    <div id="resultsEl" class="hidden">
      <div class="results-header">
        <span class="results-count" id="resultsCount"></span>
      </div>
      <div id="resultsList"></div>
    </div>
  </div>
</main>

<footer id="footer">Portal Plantio — Projetos de Plantio</footer>

<!-- PDF Viewer Overlay -->
<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-box">
    <div class="viewer-head">
      <span class="viewer-fname" id="viewerFname"></span>
      <button class="viewer-close" type="button" onclick="closeViewer()" aria-label="Fechar">&#215;</button>
    </div>
    <div class="viewer-body">
      <iframe id="viewerFrame" src="" title="Visualizador PDF"></iframe>
    </div>
  </div>
</div>

<script>
const RELEASES_REPO = 'lmalerbo/project-plantio';
// {COD_FAZ}_{NOME}_{Rev0|Exp0}.{dwg|zip|pdf}
const ASSET_RE = /^(\d+)_(.+)_(Rev\d+|Exp\d+|MapaPlantio)\.(dwg|zip|pdf)$/i;
let allFarms = [];
let showDwg  = false;

// ── API ────────────────────────────────────────────────────────────────────

async function fetchAllReleases() {
  const releases = [];
  let url = `https://api.github.com/repos/${RELEASES_REPO}/releases?per_page=100`;
  while (url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Erro ${res.status} ao buscar releases`);
    releases.push(...await res.json());
    const link = res.headers.get('Link') || '';
    const m = link.match(/<([^>]+)>;\s*rel="next"/);
    url = m ? m[1] : null;
  }
  return releases;
}

function parseReleases(releases) {
  const farmMap = new Map();
  for (const release of releases) {
    for (const asset of (release.assets ?? [])) {
      const m = asset.name.match(ASSET_RE);
      if (!m) continue;
      const [, codFaz, rawName, suffix, ext] = m;
      const farmName = rawName.trim();
      if (!farmMap.has(codFaz)) {
        farmMap.set(codFaz, { codFaz, name: farmName, files: [], updatedAt: asset.updated_at });
      }
      const farm = farmMap.get(codFaz);
      // Prefere o nome mais longo (mais completo) encontrado nos assets
      if (farmName.length > farm.name.length) farm.name = farmName;
      farm.files.push({
        suffix, ext: ext.toLowerCase(),
        size: asset.size, url: asset.browser_download_url, name: asset.name,
        updatedAt: asset.updated_at,
      });
      if (asset.updated_at > farm.updatedAt) farm.updatedAt = asset.updated_at;
    }
  }
  return [...farmMap.values()].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
}

// ── Helpers ────────────────────────────────────────────────────────────────

function fmtSize(bytes) {
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}
function fmtDate(iso) { return new Date(iso).toLocaleDateString('pt-BR'); }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const ICON_DL  = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`;
const ICON_PDF = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`;
const ICON_EYE = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;

// ── PDF Viewer ─────────────────────────────────────────────────────────────

function openViewer(url, name) {
  const viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
  document.getElementById('viewerFname').textContent = name;
  document.getElementById('viewerFrame').src = viewerUrl;
  document.getElementById('viewerOverlay').classList.add('open');
}
function closeViewer() {
  document.getElementById('viewerOverlay').classList.remove('open');
  document.getElementById('viewerFrame').src = '';
}
document.getElementById('viewerOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeViewer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
});

// ── Render ─────────────────────────────────────────────────────────────────

function renderFarm(farm) {
  // Agrupar por suffix, depois por extensão
  const bySuffix = new Map();
  for (const f of farm.files) {
    if (!bySuffix.has(f.suffix)) bySuffix.set(f.suffix, {});
    bySuffix.get(f.suffix)[f.ext] = f;
  }

  const rowsHtml = [...bySuffix.entries()].map(([suffix, byExt]) => {
    const zip = byExt['zip'];
    const dwg = byExt['dwg'];
    const pdf = byExt['pdf'];
    const parts = [`<span class="file-suffix">${esc(suffix)}</span>`];

    if (zip) {
      parts.push(`<a class="btn-dl btn-zip" href="${esc(zip.url)}" target="_blank" rel="noreferrer" download="${esc(zip.name)}">${ICON_DL} Projeto <span class="file-size">${fmtSize(zip.size)}</span></a>`);
    }
    // DWG: visível apenas no modo técnico (5 toques no rodapé)
    if (dwg && showDwg) {
      parts.push(`<a class="btn-dl btn-dwg" href="${esc(dwg.url)}" target="_blank" rel="noreferrer" download="${esc(dwg.name)}">${ICON_DL} DWG <span class="file-size">${fmtSize(dwg.size)}</span></a>`);
    }
    if (pdf) {
      parts.push(`<button class="btn-dl btn-pdf" type="button" data-url="${esc(pdf.url)}" data-name="${esc(pdf.name)}" onclick="openViewer(this.dataset.url,this.dataset.name)">${ICON_EYE} Mapa</button>`);
      parts.push(`<a class="btn-pdf-dl" href="${esc(pdf.url)}" target="_blank" rel="noreferrer" download="${esc(pdf.name)}">${ICON_DL} Baixar</a>`);
    }
    return `<div class="file-row">${parts.join('')}</div>`;
  }).join('');

  return `<div class="farm-card">
    <div class="farm-code">${esc(farm.codFaz)}</div>
    <div class="farm-name">${esc(farm.name)}</div>
    <div class="farm-date">atualizado em ${fmtDate(farm.updatedAt)}</div>
    <div class="farm-files">${rowsHtml}</div>
  </div>`;
}

function renderResults() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const resultsEl = document.getElementById('resultsEl');
  if (!q) { resultsEl.classList.add('hidden'); return; }

  const filtered = allFarms.filter(f =>
    f.name.toLowerCase().includes(q) || f.codFaz.includes(q)
  );

  resultsEl.classList.remove('hidden');
  const countEl = document.getElementById('resultsCount');
  const listEl  = document.getElementById('resultsList');

  if (filtered.length === 0) {
    const txt = document.getElementById('searchInput').value.trim();
    const waMsg = encodeURIComponent(`Olá! Gostaria de solicitar a disponibilização do projeto de plantio para a fazenda "${txt}", que ainda não está disponível no Portal Plantio.`);
    countEl.innerHTML = 'Nenhum projeto encontrado';
    listEl.innerHTML = `<div class="empty">
      <svg class="empty-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
      </svg>
      <p>Nenhum projeto disponível para essa busca.</p>
      <a class="empty-wa" href="https://wa.me/5516996427394?text=${waMsg}" target="_blank" rel="noreferrer">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17.498 14.382c-.301-.15-1.767-.867-2.04-.966-.273-.101-.473-.15-.673.15-.197.295-.771.964-.944 1.162-.175.195-.349.21-.646.075-1.888-.95-3.13-1.696-4.378-3.85-.27-.448.27-.421.772-1.401.099-.198.05-.371-.075-.521-.123-.151-.6-1.443-.823-1.992-.218-.535-.44-.46-.6-.47-.149-.01-.32-.01-.494-.01-.174 0-.457.065-.697.315-.24.249-.916.892-.916 2.18 0 1.282 1.038 2.522 1.183 2.696.149.173 2.04 3.116 4.948 4.245 2.91 1.129 2.91.752 3.435.706.525-.049 1.692-.692 1.93-1.36.24-.668.24-1.242.166-1.36-.074-.123-.273-.198-.572-.348z"/>
          <path d="M12 0C5.376 0 0 5.376 0 12c0 2.12.554 4.108 1.52 5.84L0 24l6.32-1.49A11.93 11.93 0 0012 24c6.624 0 12-5.376 12-12S18.624 0 12 0zm0 21.81c-2.063 0-4.025-.59-5.71-1.643l-.41-.255-4.227 1 .997-4.116-.27-.43A9.78 9.78 0 012.19 12c0-5.413 4.397-9.81 9.81-9.81 5.413 0 9.81 4.397 9.81 9.81 0 5.413-4.397 9.81-9.81 9.81z"/>
        </svg>
        Solicitar via WhatsApp
      </a>
    </div>`;
  } else {
    const n = filtered.length;
    countEl.innerHTML = `<strong>${n}</strong> fazenda${n !== 1 ? 's' : ''} encontrada${n !== 1 ? 's' : ''}`;
    listEl.innerHTML = filtered.map(renderFarm).join('');
  }
}

// ── Init ───────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const releases = await fetchAllReleases();
    allFarms = parseReleases(releases);
    document.getElementById('loadingEl').classList.add('hidden');

    if (allFarms.length) {
      const lastDate = allFarms.map(f => f.updatedAt).sort().at(-1);
      const s = document.getElementById('summary');
      s.classList.remove('hidden');
      s.innerHTML = `<strong>${allFarms.length}</strong> fazenda${allFarms.length !== 1 ? 's' : ''} disponíve${allFarms.length !== 1 ? 'is' : 'l'} · atualizado em ${fmtDate(lastDate)}`;

      const recent = [...allFarms].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)).slice(0, 5);
      const recentWrap  = document.getElementById('recentWrap');
      const recentPills = document.getElementById('recentPills');
      recentWrap.classList.remove('hidden');
      recentPills.innerHTML = recent.map(f =>
        `<button class="recent-pill" type="button" data-name="${esc(f.name)}">${esc(f.name)}</button>`
      ).join('');
      recentPills.querySelectorAll('.recent-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('searchInput').value = btn.dataset.name;
          document.getElementById('searchInput').dispatchEvent(new Event('input'));
          document.getElementById('searchInput').focus();
        });
      });
    }
  } catch (e) {
    document.getElementById('loadingEl').classList.add('hidden');
    document.getElementById('errorEl').classList.remove('hidden');
    document.getElementById('errorMsg').textContent = e.message;
  }
});

// ── Search ─────────────────────────────────────────────────────────────────

document.getElementById('searchInput').addEventListener('input', function () {
  const q = this.value;
  document.getElementById('searchClear').classList.toggle('on', !!q);
  document.getElementById('recentWrap').classList.toggle('hidden', !(!q && allFarms.length));
  renderResults();
});

document.getElementById('searchClear').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchInput').dispatchEvent(new Event('input'));
  document.getElementById('searchInput').focus();
});

// ── Footer: 5 toques em 1.5 s → alterna modo técnico (mostra DWG) ─────────

let footerTaps = 0, footerTimer = null;
document.getElementById('footer').addEventListener('click', () => {
  footerTaps++;
  clearTimeout(footerTimer);
  footerTimer = setTimeout(() => { footerTaps = 0; }, 1500);
  if (footerTaps >= 5) {
    footerTaps = 0;
    showDwg = !showDwg;
    renderResults();
  }
});
</script>
</body>
</html>
